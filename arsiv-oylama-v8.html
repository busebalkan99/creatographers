<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Creatorgraphers · oylama (orana uyarlamalı)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =========================================================
   Oylama · A1 dikey akış + B2 kaydırıcı + orana uyarlanan yerleşim

   Kural: fotoğraf ASLA kırpılmaz, kendi oranında durur.
   Altta kalan boşluk kontrolü alabiliyorsa kontrol akışa girer (C1).
   Alamıyorsa fotoğrafın üstüne biner (C2).
   Modern telefonda normal hâl C1; C2 sadece 9:16 dikeylerde çıkıyor.
   ========================================================= */
:root{
  --ink:#f0f0f3;
  --dim:rgba(240,240,243,.66);
  --dimmer:rgba(240,240,243,.38);
  --mark:#f4f4f7;
  --markink:#16161a;
  --mat:#141417;              /* fotoğrafın oturduğu nötr zemin */
  --ease:cubic-bezier(.32,.72,0,1);
  --pad:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:#0a0a0c;color:var(--ink);
  font-family:"Plus Jakarta Sans",system-ui,sans-serif;
  display:grid;place-items:center;overflow:hidden;
}
.device{
  width:min(390px,100vw);height:min(844px,100dvh);
  position:relative;overflow:hidden;background:var(--mat);
  border-radius:34px;border:1px solid #2c2c33;
  box-shadow:0 26px 60px -20px rgba(0,0,0,.95);
}
@media (max-width:430px){
  .device{width:100vw;height:100dvh;border-radius:0;border:0;box-shadow:none}
}

/* ---------------- akış ---------------- */
.feed{
  height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;
  scrollbar-width:none;overscroll-behavior-y:contain;
}
.feed::-webkit-scrollbar{display:none}

.shot{
  height:100%;scroll-snap-align:start;scroll-snap-stop:always;
  position:relative;background:var(--mat);
  display:flex;flex-direction:column;
  touch-action:pan-y;
}

/* ---- sahne: fotoğraf burada, kırpılmadan ---- */
.stage{
  flex:1;min-height:0;display:grid;place-items:center;
  padding:0 var(--pad);
  position:relative;
}
.shot[data-mode="overlay"] .stage{padding:0}
/* akış modunda fotoğraf üst bilginin altına girmesin */
.shot[data-mode="flow"] .stage{padding-top:var(--top-h,82px)}

/* Double-Bezel: dış kabuk (kenarlık) + iç çekirdek (calc ile küçültülmüş yarıçap) */
.frame{
  --r-out:14px; --bez:5px;
  max-width:100%;max-height:100%;
  position:relative;line-height:0;overflow:hidden;
  border:var(--bez) solid #1f1f24;              /* dış kabuk */
  border-radius:var(--r-out);
  box-shadow:
    0 0 0 1px rgba(255,255,255,.09),            /* saç teli çerçeve */
    0 14px 32px -16px rgba(16,16,19,.95);       /* gölge zemine boyandı, saf siyah değil */
}
.frame img{
  display:block;max-width:100%;max-height:100%;
  width:auto;height:auto;object-fit:contain;
  border-radius:calc(var(--r-out) - var(--bez));  /* iç yarıçap = R eksi kabuk */
  user-select:none;-webkit-user-drag:none;
}
.frame::after{                                   /* iç ışık çizgisi */
  content:'';position:absolute;inset:0;pointer-events:none;
  border-radius:calc(var(--r-out) - var(--bez));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1);
}
/* örtüşme modunda kabuk yok, fotoğraf kenardan kenara */
.shot[data-mode="overlay"] .frame{border:0;border-radius:0;box-shadow:none}
.shot[data-mode="overlay"] .frame img{border-radius:0}
.shot[data-mode="overlay"] .frame::after{display:none}

/* ---------------- üst bilgi ---------------- */
.top{
  position:absolute;top:0;left:0;right:0;z-index:6;
  padding:calc(13px + env(safe-area-inset-top)) 18px 26px;
  pointer-events:none;
}
.shot[data-mode="overlay"] .top{
  background:linear-gradient(to bottom,rgba(8,8,10,.8),rgba(8,8,10,.28) 60%,transparent);
}
.top .row{display:flex;align-items:center;gap:12px}
.top .name{font-size:16px;font-weight:700;letter-spacing:-.012em}
.top .orient{margin-left:auto}
.top .count{font-size:12.5px;font-weight:600;color:var(--dim);
  font-variant-numeric:tabular-nums;
}
.top .x{
  width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.1);font-size:14px;color:var(--dim);
}
.prog{margin-top:11px;height:2px;border-radius:2px;background:rgba(255,255,255,.18);overflow:hidden}
.prog i{display:block;height:100%;background:var(--mark)}

/* ---- oran rozeti (sadece bu prototipte, gerçek üründe olmayacak) ---- */
.orient{
  font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--dimmer);border:1px solid rgba(255,255,255,.16);
  padding:3px 7px;border-radius:99px;white-space:nowrap;
}

/* =========================================================
   PUAN
   akış modu: normal akışta, fotoğrafın altında
   örtüşme modu: fotoğrafın üstünde, gradyanla
   ========================================================= */
.rate{
  flex:0 0 auto;
  padding:16px var(--pad) calc(18px + env(safe-area-inset-bottom));
  pointer-events:none;
}
.shot[data-mode="overlay"] .rate{
  position:absolute;left:0;right:0;bottom:0;z-index:7;
  padding-top:56px;
  background:linear-gradient(to top,rgba(8,8,10,.9) 46%,rgba(8,8,10,.5) 74%,transparent);
}
.rate .lbl{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:12px}
.rate .hint{font-size:12px;color:var(--dim);letter-spacing:.02em;padding-bottom:4px}
.rate .val{
  font-size:36px;font-weight:800;line-height:.82;letter-spacing:-.035em;
  font-variant-numeric:tabular-nums;
}
.rate .val.empty{font-size:13px;font-weight:600;color:var(--dimmer);letter-spacing:0;line-height:1.2}

/* hat: tek dokunulabilir alan */
.slider{
  position:relative;height:52px;
  pointer-events:auto;touch-action:none;cursor:grab;
}
.slider:active{cursor:grabbing}
.track{
  position:absolute;inset:0;border-radius:26px;overflow:hidden;
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.15);
}
.shot[data-mode="overlay"] .track{backdrop-filter:blur(12px);background:rgba(255,255,255,.13)}
.track .fill{
  position:absolute;left:0;top:0;bottom:0;width:0%;
  background:rgba(255,255,255,.17);transition:width .07s linear;
}
.ticks{
  position:absolute;inset:0;display:flex;align-items:center;
  justify-content:space-between;padding:0 22px;pointer-events:none;
}
.ticks span{font-size:11px;font-weight:600;color:rgba(255,255,255,.4);font-variant-numeric:tabular-nums}
.ticks i{width:1px;height:9px;background:rgba(255,255,255,.2);display:block}
.knob{
  position:absolute;top:50%;left:0;width:46px;height:46px;border-radius:50%;
  background:var(--mark);color:var(--markink);
  transform:translate(-50%,-50%);display:grid;place-items:center;
  font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;
  box-shadow:0 3px 12px -3px rgba(0,0,0,.85);
  transition:left .07s linear,opacity .2s var(--ease),transform .16s var(--ease);
  opacity:0;pointer-events:none;
}
.shot.scored .knob{opacity:1}
.slider:active .knob{transform:translate(-50%,-50%) scale(1.06)}


/* atlanandan dönülen kare kısa süre işaretlenir */
.shot.seek .slider .track{
  border-color:rgba(255,255,255,.6);
  background:rgba(255,255,255,.2);
}
.shot.seek .hint{color:var(--ink)}

/* ---------------- bitiş ---------------- */
.done{
  height:100%;scroll-snap-align:start;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:15px;padding:36px;text-align:center;
}
.done h2{font-size:25px;font-weight:800;letter-spacing:-.022em}
.done p{font-size:14px;color:var(--dim);line-height:1.65;max-width:30ch}
.done .skipped{
  font-size:13px;background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.14);border-radius:11px;padding:12px 16px;line-height:1.6;
}
.done button{
  margin-top:4px;height:48px;padding:0 26px;border-radius:12px;border:0;
  background:var(--mark);color:var(--markink);
  font:inherit;font-size:15px;font-weight:700;cursor:pointer;
  transition:transform .16s var(--ease);
}
.done button:active{transform:scale(.97)}


@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.001ms !important}
}
</style>
</head>
<body>

<div class="device"><div class="feed" id="feed"></div></div>

<script>
/* Gerçek bir kulüpte çıkacak karışım: makine yatay/dikey, telefon dikey, kare, panorama */
const SHOTS = [
  {w:1200, h:800,  label:'yatay 3:2'},
  {w:800,  h:1200, label:'dikey 2:3'},
  {w:1000, h:1000, label:'kare 1:1'},
  {w:900,  h:1600, label:'telefon 9:16'},
  {w:1600, h:900,  label:'geniş 16:9'},
  {w:1200, h:900,  label:'yatay 4:3'},
  {w:900,  h:1200, label:'dikey 3:4'},
  {w:1800, h:750,  label:'panorama 12:5'},
];
const N = SHOTS.length;

let html = '';
SHOTS.forEach((s,i)=>{
  html += `
  <section class="shot" data-i="${i}">
    <div class="top">
      <div class="row">
        <span class="name">Sokak</span>
        <span class="orient">${s.label}</span>
        <span class="count">${i+1} / ${N}</span>
        <span class="x">✕</span>
      </div>
      <div class="prog"><i style="width:${((i+1)/N*100).toFixed(1)}%"></i></div>
    </div>

    <div class="stage">
      <div class="frame">
        <img src="https://picsum.photos/seed/cg-v8-${i}/${s.w}/${s.h}"
             width="${s.w}" height="${s.h}" alt="" loading="eager" draggable="false">
      </div>
    </div>

    <div class="rate">
      <div class="lbl">
        <span class="hint">sürükleyerek puan ver</span>
        <span class="val empty">puan yok</span>
      </div>
      <div class="slider">
        <div class="track">
          <span class="fill"></span>
          <span class="ticks">
            <span>1</span><i></i><i></i><i></i><span>5</span><i></i><i></i><i></i><span>10</span>
          </span>
        </div>
        <span class="knob">5</span>
      </div>
    </div>
  </section>`;
});
html += `
  <section class="done" id="done">
    <h2>Sokak bitti</h2>
    <p>Bu temadaki bütün kareleri gezdin.</p>
    <div class="skipped" id="skipMsg" hidden></div>
    <button id="again">Başa dön</button>
  </section>`;
document.getElementById('feed').innerHTML = html;

/* =========================================================
   YERLEŞİM KARARI
   Fotoğraf kendi oranında ne kadar yer kaplıyor, altta ne kalıyor?
   Kalan boşluk kontrolü alabiliyorsa akışa koy, alamıyorsa üstüne bindir.
   ========================================================= */
function layout(){
  const shots = [...document.querySelectorAll('.shot')];
  if(!shots.length) return;

  /* Eşik sabit sayı değil: kontrolün ve üst bilginin GERÇEK yüksekliği ölçülür.
     Ölçebilmek için önce hepsi akış moduna alınır. */
  shots.forEach(s=> s.dataset.mode = 'flow');
  const ctrlH = shots[0].querySelector('.rate').offsetHeight;
  const topH  = shots[0].querySelector('.top').offsetHeight;
  const padX  = parseFloat(getComputedStyle(shots[0].querySelector('.stage')).paddingLeft) || 0;

  shots.forEach((shot,i)=>{
    shot.style.setProperty('--top-h', topH + 'px');
    const s      = SHOTS[i];
    const availW = shot.clientWidth - 2*padX;
    const availH = shot.clientHeight - topH;
    const shownH = Math.min(availH, availW * s.h / s.w);
    shot.dataset.mode = (availH - shownH) >= ctrlH ? 'flow' : 'overlay';
  });
}
layout();
addEventListener('resize', layout);
if(document.fonts) document.fonts.ready.then(layout);

/* ---------------- kaydırıcı ---------------- */
const scores = new Array(N).fill(null);
document.querySelectorAll('.shot').forEach(shot=>{
  const i      = +shot.dataset.i;
  const slider = shot.querySelector('.slider');
  const fill   = shot.querySelector('.fill');
  const knob   = shot.querySelector('.knob');
  const val    = shot.querySelector('.val');
  const hint   = shot.querySelector('.hint');

  const paint = v=>{
    const pct = (v-1)/9*100;
    fill.style.width = pct+'%';
    knob.style.left  = pct+'%';
    knob.textContent = v;
    val.textContent  = v;
    val.classList.remove('empty');
    hint.textContent = 'puanın';
    shot.classList.add('scored');
    scores[i] = v;
  };
  const fromX = x=>{
    const r = slider.getBoundingClientRect();
    return Math.round(1 + Math.max(0, Math.min(1,(x-r.left)/r.width))*9);
  };
  let drag=false;
  slider.addEventListener('pointerdown', e=>{ drag=true; slider.setPointerCapture(e.pointerId); paint(fromX(e.clientX)); });
  slider.addEventListener('pointermove', e=>{ if(drag) paint(fromX(e.clientX)); });
  const end=()=>drag=false;
  slider.addEventListener('pointerup', end);
  slider.addEventListener('pointercancel', end);
});

const doneEl  = document.getElementById('done');
const skipMsg = document.getElementById('skipMsg');
const btn     = document.getElementById('again');
const title   = doneEl.querySelector('h2');
const lede    = doneEl.querySelector('p');

/* puanlanmamış karelerin indeksi */
const missing = () => scores.reduce((a,s,ix)=> s==null ? [...a,ix] : a, []);

function refresh(){
  const m = missing();
  skipMsg.hidden = false;
  if(m.length){
    title.textContent = 'Bir şey eksik';
    lede.textContent  = 'Puan vermeden tema kapanmıyor.';
    skipMsg.textContent = m.length === 1
      ? `${m[0]+1}. kareye puan vermedin.`
      : `${m.length} kareye puan vermedin: ${m.map(i=>i+1).join(', ')}`;
    btn.textContent = m.length === 1
      ? `${m[0]+1}. kareye git`
      : `İlk atladığına git (${m[0]+1}.)`;
  } else {
    title.textContent = 'Sokak bitti';
    lede.textContent  = 'Bütün karelere puan verdin. Gerçek üründe buradan Portre temasına geçilir; bu prototipte tek tema var.';
    skipMsg.hidden = true;
    btn.textContent = 'Başa dön';
  }
}

new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting) refresh();
}),{threshold:.6}).observe(doneEl);

/* tıklarken yeniden hesapla: arada puan verilmiş olabilir */
btn.addEventListener('click', ()=>{
  const m = missing();
  if(!m.length){
    document.getElementById('feed').scrollTo({top:0,behavior:'smooth'});
    return;
  }
  const target = document.querySelector(`.shot[data-i="${m[0]}"]`);
  /* snap konteynerinde scrollIntoView güvenilir değil, konumu doğrudan ver */
  document.getElementById('feed').scrollTo({top:target.offsetTop, behavior:'smooth'});
  /* gidilen kareyi kısa süre işaretle */
  target.classList.add('seek');
  setTimeout(()=> target.classList.remove('seek'), 1600);
});

</script>
</body>
</html>
